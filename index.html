<style>
  /* Layout: one centered column, big greeting, the 1978 K&R snippet beneath it */
  :root {
    --bg: #f3f5f8;
    --fg: #14181f;
    --muted: #5b6574;
    --accent: #2f5bd3;
    --code-bg: #e6eaf1;
    --display: "Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #11141a; --fg: #e9edf3; --muted: #95a0b2; --accent: #7d9cf5; --code-bg: #1c212a;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #11141a; --fg: #e9edf3; --muted: #95a0b2; --accent: #7d9cf5; --code-bg: #1c212a;
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--display);
    display: grid;
    place-items: center;
    padding-block: 48px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    box-sizing: border-box;
  }
  main { display: grid; gap: 24px; max-width: 40rem; width: 100%; }
  h1 {
    margin: 0;
    font-weight: 700;
    font-size: clamp(3rem, 12vw, 6.5rem);
    line-height: 0.95;
    letter-spacing: -0.03em;
    text-wrap: balance;
  }
  h1 span { color: var(--accent); }
  pre {
    margin: 0;
    background: var(--code-bg);
    border-radius: 6px;
    padding: 16px 20px;
    font-family: var(--mono);
    font-size: 0.95rem;
    line-height: 1.6;
    overflow-x: auto;
  }
  p { margin: 0; color: var(--muted); font-size: 1rem; line-height: 1.5; }
  .next {
    justify-self: start; display: inline-block; min-height: 44px; box-sizing: border-box; padding: 10px 18px;
    font-weight: 700; font-size: 1rem; text-decoration: none; color: var(--bg); background: var(--accent);
    border-radius: 6px; transition: transform .12s;
  }
  .next:hover { transform: translateY(-2px) rotate(-1deg); }
  .next:focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; }
</style>
</head>
<body>

<main>
  <h1>Hello, <span>world.</span></h1>
  <pre><code>main()
{
    printf("hello, world\n");
}</code></pre>
  <p>The first program in Kernighan and Ritchie's <i>The C Programming Language</i>, 1978.</p>
  <a class="next" href="game/">Now it fights back &rarr;</a>
</main>
</body>
</html>
