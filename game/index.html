<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>hello, world (the sequel)</title>
<meta name="description" content="The first program in K&amp;R, 1978. It has teeth now. Catch the letters in order, dodge the daggers.">
<meta name="theme-color" content="#f2e6c9">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Rye&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
  :root {
    --paper: #f2e6c9; --ink: #1a1412; --red: #d6352b; --mustard: #eab33a;
    --teal: #1f8a84; --navy: #264a66; --cream: #fbf3de;
    --display: "Pirata One", Georgia, serif;
    --label: "Rye", Georgia, serif;
    --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--paper); overscroll-behavior: none; }
  body { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; font-family: var(--mono); color: var(--ink); }
  body.playing { cursor: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  .screen {
    position: fixed; inset: 0; display: grid; place-items: center; overflow: auto;
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    pointer-events: none;
  }
  .screen.hidden { display: none; }
  .card {
    pointer-events: auto; position: relative; width: min(100%, 27rem);
    background: var(--cream); border: 4px solid var(--ink); border-radius: 10px;
    box-shadow: 8px 8px 0 var(--ink), 8px 8px 0 3px var(--red);
    padding: clamp(16px, 4vh, 28px) clamp(18px, 5vw, 30px);
    transform: rotate(-1.2deg); text-align: center;
    animation: pop .45s cubic-bezier(.2,1.4,.4,1) both;
  }
  .card::before { /* inner stitch line, like a flash sheet border */
    content: ""; position: absolute; inset: 6px; border: 1.5px solid var(--ink); border-radius: 5px; opacity: .55; pointer-events: none;
  }
  @keyframes pop { from { transform: rotate(-6deg) scale(.7); opacity: 0; } to { transform: rotate(-1.2deg) scale(1); opacity: 1; } }
  .kicker { margin: 0; font: 400 .72rem/1.3 var(--mono); letter-spacing: .18em; text-transform: uppercase; color: var(--red); font-weight: 700; }
  h1, h2 {
    margin: .1em 0 .15em; font: 400 clamp(3.4rem, 17vw, 6.2rem)/.86 var(--display); letter-spacing: -.01em;
    color: var(--mustard); -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill;
    text-shadow: 4px 4px 0 var(--red); text-wrap: balance;
  }
  h2 { font-size: clamp(2.6rem, 13vw, 4.2rem); }
  .tag { margin: 0 0 14px; font-size: .86rem; line-height: 1.5; }
  .tag b { background: var(--ink); color: var(--cream); padding: 0 .3em; border-radius: 3px; font-weight: 700; }
  .go {
    appearance: none; cursor: pointer; font: 400 1.7rem/1 var(--label); letter-spacing: .04em;
    color: var(--ink); background: var(--mustard); border: 4px solid var(--ink); border-radius: 8px;
    padding: 12px 34px 10px; min-height: 52px; box-shadow: 5px 5px 0 var(--ink);
    transition: transform .08s, box-shadow .08s;
  }
  .go:hover { background: #f2c14f; }
  .go:active { transform: translate(4px, 4px); box-shadow: 1px 1px 0 var(--ink); }
  .go:focus-visible, .snd:focus-visible, .back:focus-visible { outline: 3px solid var(--red); outline-offset: 3px; }
  .how { margin: 12px 0 0; font-size: .74rem; opacity: .7; }
  .back { display: inline-block; margin-top: 10px; font-size: .78rem; color: var(--ink); padding: 8px 4px; }
  .score { font: 400 clamp(3rem, 14vw, 4.6rem)/1 var(--display); color: var(--red); margin: 2px 0 0; -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; }
  .rank { margin: 0 0 10px; font: 400 1.05rem/1.2 var(--label); }
  .msg { margin: 0 0 4px; font-size: .88rem; line-height: 1.45; min-height: 2.6em; }
  .best { margin: 0 0 14px; font-size: .78rem; opacity: .8; }
  .best.new { opacity: 1; color: var(--red); font-weight: 700; }
  .snd {
    position: fixed; z-index: 5; right: max(10px, env(safe-area-inset-right)); bottom: max(10px, env(safe-area-inset-bottom));
    appearance: none; cursor: pointer; font: 700 .7rem/1 var(--mono); letter-spacing: .08em; text-transform: uppercase;
    background: var(--cream); color: var(--ink); border: 2.5px solid var(--ink); border-radius: 999px; padding: 0 14px; min-height: 40px;
    box-shadow: 3px 3px 0 var(--ink);
  }
  @media (max-height: 520px) {
    .card { padding: 12px 18px; } h1 { font-size: 3rem; } .tag { display: none; } .go { padding: 8px 26px 6px; min-height: 44px; font-size: 1.4rem; }
  }
  @media (prefers-reduced-motion: reduce) { .card { animation: none; } }
</style>
</head>
<body>
<canvas id="c" aria-label="hello, world, the game"></canvas>

<button class="snd" id="snd" type="button">sound on</button>

<div class="screen" id="title">
  <section class="card">
    <p class="kicker">K&amp;R &middot; 1978 &middot; the sequel</p>
    <h1>hello,<br>world</h1>
    <p class="tag">The first program you ever ran has teeth now. Catch the letters <b>in order</b>. Dodge the daggers.</p>
    <button class="go" id="play" type="button">FLY</button>
    <p class="how">mouse, finger, or arrow keys</p>
    <a class="back" href="../">&larr; back to the original</a>
  </section>
</div>

<div class="screen hidden" id="over">
  <section class="card">
    <p class="kicker" id="kick">exit code 1</p>
    <h2>Ouch.</h2>
    <p class="score" id="finalScore">0</p>
    <p class="rank" id="rank">scratcher</p>
    <p class="msg" id="msg"></p>
    <p class="best" id="best"></p>
    <button class="go" id="again" type="button">AGAIN</button>
    <br><a class="back" href="../">&larr; back to the original</a>
  </section>
</div>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const cv = $("c"), ctx = cv.getContext("2d");
  const C = { paper: "#f2e6c9", ink: "#1a1412", red: "#d6352b", mustard: "#eab33a", teal: "#1f8a84", navy: "#264a66", cream: "#fbf3de", pink: "#ef8f8a" };
  const DISPLAY_FONT = '"Pirata One", Georgia, serif';
  const MONO_FONT = '"JetBrains Mono", ui-monospace, Menlo, monospace';
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

  // The first program in K&R, as a sequence of catchable tokens.
  const TOKENS = ["h", "e", "l", "l", "o", ",", "w", "o", "r", "l", "d", "\\n"];
  const PHRASE = Array.from("hello, world\\n");
  const RANGES = []; // token index -> [start, end) in PHRASE
  { let di = 0; TOKENS.forEach((t, i) => { RANGES.push([di, di + t.length]); di += t.length; if (i === 5) di += 1; }); }
  const LETTER_SET = Array.from(new Set(TOKENS));

  const RANKS = [[0, "syntax error"], [60, "scratcher"], [200, "apprentice"], [500, "shop regular"], [1000, "journeyman"], [2000, "master of flash"], [4000, "dennis ritchie"]];
  const OVER_MSGS = [
    "Segmentation fault (core dumped).", "Typo in the tattoo. Classic.", "Undefined behavior. Still looks cool.",
    "Compiled with warnings. Healed with regrets.", "Mom is going to see this.", "Off by one. In permanent ink.",
    "Forgot the semicolon. Again.", "The ink's still wet. Go again."
  ];

  let W = 0, H = 0, u = 1, dpr = 1, bg = null;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // ---------- Sprites (Path2D, drawn facing "up" unless noted, ~40 units wide) ----------
  const P = {};
  P.heart = new Path2D("M0 14C-26 -2 -14 -20 0 -7C14 -20 26 -2 0 14Z");
  P.circle = new Path2D(); P.circle.arc(0, 0, 19, 0, Math.PI * 2);
  // swallow
  P.tail = new Path2D("M-7 14L-19 48L-3 34L3 34L19 48L7 14Z");
  P.wing = new Path2D("M0 -4C14 -18 36 -16 52 6C36 0 20 8 0 8Z");
  P.body = new Path2D(); P.body.ellipse(0, 0, 11, 21, 0, 0, Math.PI * 2);
  P.belly = new Path2D(); P.belly.ellipse(0, 7, 6, 12, 0, 0, Math.PI * 2);
  P.head = new Path2D(); P.head.arc(0, -21, 9, 0, Math.PI * 2);
  P.beak = new Path2D("M-3 -27L0 -39L3 -27Z");
  P.throat = new Path2D(); P.throat.ellipse(0, -15, 5, 4, 0, 0, Math.PI * 2);
  // dagger (tip points to +y)
  P.dBlade = new Path2D("M0 40L-6 -4L6 -4Z");
  P.dGuard = new Path2D(); P.dGuard.rect(-14, -9, 28, 6);
  P.dHilt = new Path2D(); P.dHilt.rect(-3.5, -31, 7, 22);
  P.dPommel = new Path2D(); P.dPommel.arc(0, -34, 5.5, 0, Math.PI * 2);
  // skull
  P.sHead = new Path2D(); P.sHead.arc(0, -4, 18, 0, Math.PI * 2);
  P.sJaw = new Path2D(); P.sJaw.roundRect ? P.sJaw.roundRect(-10, 8, 20, 14, 3) : P.sJaw.rect(-10, 8, 20, 14);
  P.sEyeL = new Path2D(); P.sEyeL.arc(-7, -4, 5.2, 0, Math.PI * 2);
  P.sEyeR = new Path2D(); P.sEyeR.arc(7, -4, 5.2, 0, Math.PI * 2);
  P.sNose = new Path2D("M0 3L-3.5 9L3.5 9Z");
  // nautical compass star
  { const p = new Path2D(); for (let i = 0; i < 16; i++) { const a = i * Math.PI / 8 - Math.PI / 2; const r = i % 4 === 0 ? 27 : i % 2 === 0 ? 14 : 5.5; p[i ? "lineTo" : "moveTo"](Math.cos(a) * r, Math.sin(a) * r); } p.closePath(); P.star = p; }

  // Print-misregistration look: the colour fill sits a hair off the black outline.
  function paint(path, fill, lw = 3) {
    if (fill) { ctx.save(); ctx.translate(2.2, 2.2); ctx.fillStyle = fill; ctx.fill(path); ctx.restore(); }
    ctx.lineWidth = lw; ctx.lineJoin = "round"; ctx.lineCap = "round"; ctx.strokeStyle = C.ink; ctx.stroke(path);
  }

  function drawSwallow(x, y, rot, flap) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(u * 1.05, u * 1.05);
    paint(P.tail, C.navy);
    const a = Math.sin(flap) * 0.75 - 0.25;
    ctx.save(); ctx.translate(7, -4); ctx.rotate(a); paint(P.wing, C.teal); ctx.restore();
    ctx.save(); ctx.translate(-7, -4); ctx.scale(-1, 1); ctx.rotate(a); paint(P.wing, C.teal); ctx.restore();
    paint(P.body, C.navy); paint(P.belly, C.cream, 2);
    ctx.save(); ctx.translate(0, 5); ctx.scale(0.34, 0.34); paint(P.heart, C.red, 6); ctx.restore();
    paint(P.head, C.navy); paint(P.throat, C.red, 2); paint(P.beak, C.mustard, 2.5);
    ctx.fillStyle = C.cream; ctx.beginPath(); ctx.arc(-4.6, -22.5, 2.4, 0, 7); ctx.arc(4.6, -22.5, 2.4, 0, 7); ctx.fill();
    ctx.fillStyle = C.ink; ctx.beginPath(); ctx.arc(-4.6, -22.5, 1.2, 0, 7); ctx.arc(4.6, -22.5, 1.2, 0, 7); ctx.fill();
    ctx.restore();
  }
  function drawDagger(e) {
    ctx.save(); ctx.translate(e.x, e.y); ctx.rotate(e.rot); ctx.scale(u, u);
    paint(P.dHilt, C.red); paint(P.dPommel, C.mustard); paint(P.dGuard, C.mustard); paint(P.dBlade, C.cream);
    ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(0, 30); ctx.lineTo(0, 2); ctx.stroke();
    ctx.restore();
  }
  function drawSkull(e) {
    ctx.save(); ctx.translate(e.x, e.y); ctx.rotate(e.rot); ctx.scale(u * 1.05, u * 1.05);
    paint(P.sJaw, C.cream); paint(P.sHead, C.cream);
    ctx.fillStyle = C.ink; ctx.fill(P.sEyeL); ctx.fill(P.sEyeR); ctx.fill(P.sNose);
    ctx.fillStyle = C.red; ctx.beginPath(); ctx.arc(-7 + Math.sin(e.age * 5) * 1.2, -4, 1.9, 0, 7); ctx.arc(7 + Math.sin(e.age * 5) * 1.2, -4, 1.9, 0, 7); ctx.fill();
    ctx.lineWidth = 1.6; ctx.beginPath(); for (const x of [-5, 0, 5]) { ctx.moveTo(x, 10); ctx.lineTo(x, 21); } ctx.stroke();
    ctx.restore();
  }
  function drawStar(e) {
    const s = 1.05 + Math.sin(e.age * 6) * 0.1;
    ctx.save(); ctx.translate(e.x, e.y); ctx.rotate(Math.sin(e.age * 2) * 0.2); ctx.scale(u * s, u * s);
    paint(P.star, C.mustard, 3);
    ctx.fillStyle = C.red; ctx.beginPath(); ctx.arc(0, 0, 4.2, 0, 7); ctx.fill(); ctx.lineWidth = 2; ctx.stroke();
    ctx.restore();
  }
  function drawLetter(e, needed) {
    ctx.save(); ctx.translate(e.x, e.y); ctx.rotate(e.rot); ctx.scale(u, u);
    if (needed) {
      ctx.strokeStyle = C.red; ctx.lineWidth = 3; ctx.setLineDash([5, 6]); ctx.lineDashOffset = -e.age * 18;
      ctx.beginPath(); ctx.arc(0, 0, 28 + Math.sin(e.age * 7) * 2.5, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
    }
    paint(P.circle, needed ? C.mustard : C.teal);
    ctx.fillStyle = needed ? C.ink : C.cream; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    if (e.ch === ",") {
      ctx.beginPath(); ctx.arc(0, -3, 4.2, 0, 7); ctx.fill(); ctx.lineWidth = 3.4; ctx.strokeStyle = ctx.fillStyle; ctx.beginPath(); ctx.moveTo(1, 0); ctx.lineTo(-3.5, 10); ctx.stroke();
    } else if (e.ch === "\\n") {
      ctx.font = `700 17px ${MONO_FONT}`; ctx.fillText("\\n", 0, 1);
    } else {
      ctx.font = `30px ${DISPLAY_FONT}`; ctx.fillText(e.ch, 0, 2);
    }
    ctx.restore();
  }

  // ---------- Background ----------
  function makeBg() {
    bg = document.createElement("canvas"); bg.width = Math.ceil(W * dpr); bg.height = Math.ceil(H * dpr);
    const b = bg.getContext("2d"); b.scale(dpr, dpr);
    b.fillStyle = C.paper; b.fillRect(0, 0, W, H);
    for (let i = 0; i < W * H / 700; i++) { b.fillStyle = `rgba(120,80,40,${rnd(0.03, 0.09)})`; b.fillRect(rnd(0, W), rnd(0, H), rnd(1, 2.4), rnd(1, 2.4)); }
    // halftone vignette
    const sp = Math.max(10, 13 * u), reach = 0.3 * Math.min(W, H);
    b.fillStyle = "rgba(150,70,40,0.22)";
    for (let row = 0, y = 0; y < H + sp; y += sp * 0.866, row++) {
      for (let x = (row % 2) * sp / 2; x < W + sp; x += sp) {
        const e = Math.min(x, W - x, y, H - y) / reach;
        const r = (1 - clamp(e, 0, 1)) * sp * 0.42;
        if (r > 0.5) { b.beginPath(); b.arc(x, y, r, 0, 7); b.fill(); }
      }
    }
    // flash-sheet border
    b.strokeStyle = C.ink; b.lineWidth = 4; b.strokeRect(9, 9, W - 18, H - 18);
    b.lineWidth = 1.5; b.strokeRect(17, 17, W - 34, H - 34);
    b.fillStyle = C.ink; for (const [x, y] of [[13, 13], [W - 13, 13], [13, H - 13], [W - 13, H - 13]]) { b.beginPath(); b.arc(x, y, 3.5, 0, 7); b.fill(); }
  }
  const specks = [];
  function seedSpecks() { specks.length = 0; for (let i = 0; i < 22; i++) specks.push({ x: rnd(0, W), y: rnd(0, H), s: rnd(3, 7), v: rnd(6, 20), r: rnd(0, 6) }); }

  // ---------- State ----------
  let state = "title", time = 0, playT = 0, score = 0, combo = 0, lives = 3, prog = 0, loops = 0;
  let best = 0; try { best = +localStorage.getItem("hello-world-best") || 0; } catch (e) {}
  const ents = [], parts = [], texts = [], trail = [], outLines = ["$ ./a.out"];
  let spawnT = 0, starT = 20, shake = 0, flash = 0, overShown = false, overTimer = 0, hitPulse = 0;
  const player = { x: 0, y: 0, tx: 0, ty: 0, rot: 0, flap: 0, inv: 0, dead: false, vx: 0, vy: 0 };
  const pointer = { x: null, y: null, touch: false };
  const keys = new Set();
  const mult = () => Math.min(6, 1 + Math.floor(combo / 4));

  // ---------- Sound ----------
  let ac = null, muted = false; try { muted = localStorage.getItem("hello-world-muted") === "1"; } catch (e) {}
  function audio() { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (ac && ac.state === "suspended") ac.resume(); return ac; }
  function tone(f, d, type = "square", v = 0.05, slide = 0, delay = 0) {
    if (muted) return; const a = audio(); if (!a) return; const t = a.currentTime + delay;
    const o = a.createOscillator(), g = a.createGain(); o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d + 0.03);
  }
  const sfx = {
    good: (n) => { tone(520 + n * 45, 0.09); tone(780 + n * 45, 0.12, "square", 0.04, 0, 0.06); },
    typo: () => tone(170, 0.2, "sawtooth", 0.06, -80),
    hit: () => { tone(140, 0.4, "sawtooth", 0.09, -90); tone(70, 0.4, "square", 0.08, -30); },
    line: () => [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.16, "square", 0.05, 0, i * 0.07)),
    star: () => [392, 587, 784].forEach((f, i) => tone(f, 0.14, "triangle", 0.07, 0, i * 0.06)),
    over: () => [392, 330, 262, 196].forEach((f, i) => tone(f, 0.26, "triangle", 0.08, 0, i * 0.16)),
    start: () => { tone(330, 0.1); tone(494, 0.14, "square", 0.05, 0, 0.08); },
  };
  function syncSnd() { $("snd").textContent = muted ? "sound off" : "sound on"; }
  $("snd").addEventListener("click", (e) => { e.stopPropagation(); muted = !muted; try { localStorage.setItem("hello-world-muted", muted ? "1" : "0"); } catch (er) {} syncSnd(); if (!muted) sfx.start(); });
  $("snd").addEventListener("pointerdown", (e) => e.stopPropagation());
  syncSnd();

  // ---------- Effects ----------
  function burst(x, y, color, n, sp = 260, size = 5) {
    for (let i = 0; i < n; i++) { const a = rnd(0, 6.283), s = rnd(0.25, 1) * sp * u; parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 60 * u, r: rnd(0.4, 1) * size * u, life: rnd(0.45, 0.95), max: 0.95, c: color }); }
  }
  function popText(text, x, y, size = 24, color = C.mustard, life = 0.9, rise = 70) { texts.push({ text, x, y, size, color, life, max: life, rise }); }

  // ---------- Spawning ----------
  function neededCh() { return TOKENS[prog]; }
  function spawnLetter(ch) {
    ents.push({ type: "letter", ch, x: rnd(40 * u, W - 40 * u), y: -40 * u, x0: 0, vy: (115 + rnd(0, 55) + Math.min(playT, 90) * 0.7) * u, rot: 0, vr: rnd(-0.8, 0.8), ph: rnd(0, 6), age: 0 });
    const e = ents[ents.length - 1]; e.x0 = e.x;
  }
  function spawnDagger() {
    const vy = (190 + Math.min(playT, 90) * 3 + loops * 12) * u, x = rnd(30 * u, W - 30 * u);
    let vx = rnd(-30, 30) * u;
    if (Math.random() < 0.45 && !player.dead) { const tt = (player.y + 80 * u) / vy; vx = clamp((player.x - x) / tt + rnd(-30, 30) * u, -150 * u, 150 * u); }
    ents.push({ type: "dagger", x, y: -80 * u, vx, vy, rot: Math.atan2(-vx, vy), age: 0 });
  }
  function spawnSkull() {
    const left = Math.random() < 0.5;
    ents.push({ type: "skull", x: left ? -40 * u : W + 40 * u, y0: rnd(H * 0.2, H * 0.6), y: 0, vx: (left ? 1 : -1) * rnd(90, 150 + Math.min(playT, 90)) * u, rot: 0, age: 0 });
  }
  function spawnStar() { ents.push({ type: "star", x: rnd(50 * u, W - 50 * u), y: -40 * u, vy: 100 * u, x0: 0, age: 0 }); ents[ents.length - 1].x0 = ents[ents.length - 1].x; }
  function spawnTick() {
    const needed = neededCh(), has = ents.some((e) => e.type === "letter" && e.ch === needed), r = Math.random();
    if (!has && r < 0.7) return spawnLetter(needed);
    if (r < 0.5) { const decoys = LETTER_SET.filter((c) => c !== needed); return spawnLetter(Math.random() < 0.4 ? needed : decoys[(Math.random() * decoys.length) | 0]); }
    if (playT > 14 && Math.random() < 0.24) return spawnSkull();
    spawnDagger();
  }

  // ---------- Game flow ----------
  function resetPlayer() {
    player.x = player.tx = W / 2; player.y = player.ty = H * 0.78; player.rot = 0; player.inv = 0; player.dead = false; player.vx = player.vy = 0;
  }
  function startGame() {
    audio(); sfx.start();
    ents.length = parts.length = texts.length = trail.length = 0; outLines.length = 0; outLines.push("$ ./a.out");
    score = 0; combo = 0; lives = 3; prog = 0; loops = 0; playT = 0; spawnT = 0.6; starT = 20; shake = flash = hitPulse = 0; overShown = false; clearTimeout(overTimer);
    resetPlayer(); if (pointer.x != null) setTarget(pointer.x, pointer.y, pointer.touch);
    state = "play"; document.body.classList.add("playing");
    $("title").classList.add("hidden"); $("over").classList.add("hidden");
    spawnLetter("h"); ents[0].y = H * 0.35;
  }
  function endGame() {
    state = "over"; player.dead = true; player.vy = -380 * u; player.vx = rnd(-120, 120) * u; document.body.classList.remove("playing");
    sfx.over(); burst(player.x, player.y, C.red, 36, 380, 7); burst(player.x, player.y, C.navy, 20, 300, 6); shake = 0.8;
    const isBest = score > best; if (isBest) { best = score; try { localStorage.setItem("hello-world-best", String(best)); } catch (e) {} }
    overTimer = setTimeout(() => {
      $("finalScore").textContent = score;
      $("rank").textContent = RANKS.filter((r) => score >= r[0]).pop()[1];
      $("msg").textContent = OVER_MSGS[(Math.random() * OVER_MSGS.length) | 0];
      $("kick").textContent = loops ? `printed ${loops} line${loops > 1 ? "s" : ""} before exit` : "exit code 1";
      const b = $("best"); b.textContent = isBest && score > 0 ? "new best!" : `best ${best}`; b.classList.toggle("new", isBest && score > 0);
      $("over").classList.remove("hidden"); overShown = true; $("again").focus({ preventScroll: true });
    }, 950);
  }
  function takeHit() {
    lives--; player.inv = 1.8; shake = 0.55; combo = 0; hitPulse = 1; sfx.hit();
    burst(player.x, player.y, C.red, 26, 320, 6); burst(player.x, player.y, C.ink, 10, 220, 4); popText("ow.", player.x, player.y - 30 * u, 30 * u, C.red);
    if (lives <= 0) endGame();
  }
  function collectLetter(e) {
    if (e.ch === neededCh()) {
      prog++; combo++; const gain = 10 * mult(); score += gain; sfx.good(prog);
      burst(e.x, e.y, C.mustard, 12, 240, 5); popText("+" + gain, e.x, e.y - 20 * u, 24 * u, C.mustard);
      if (combo > 0 && combo % 4 === 0) popText("x" + mult(), player.x, player.y - 56 * u, 30 * u, C.red, 1);
      if (prog >= TOKENS.length) completeLine();
    } else {
      combo = 0; shake = Math.max(shake, 0.18); sfx.typo(); burst(e.x, e.y, C.teal, 10, 200, 4);
      popText("typo", e.x, e.y - 20 * u, 24 * u, C.teal);
    }
  }
  function completeLine() {
    loops++; prog = 0; score += 100 * loops; flash = 0.75; shake = Math.max(shake, 0.3); sfx.line();
    outLines.push("hello, world"); if (outLines.length > 40) outLines.shift();
    popText("hello, world", W / 2, H * 0.4, Math.min(60 * u, W / 7), C.mustard, 1.6, 40);
    popText("+" + 100 * loops, W / 2, H * 0.4 + 46 * u, 28 * u, C.red, 1.6, 40);
    if (lives < 3) { lives++; popText("+1 life", player.x, player.y - 50 * u, 26 * u, C.red, 1.3); }
    burst(W / 2, H * 0.4, C.mustard, 40, 420, 6); burst(W / 2, H * 0.4, C.red, 20, 340, 5);
  }
  function collectStar(e) {
    sfx.star(); flash = 0.55; popText("return 0;", e.x, e.y - 24 * u, 32 * u, C.mustard, 1.3);
    let n = 0;
    for (let i = ents.length - 1; i >= 0; i--) { const o = ents[i]; if (o.type === "dagger" || o.type === "skull") { burst(o.x, o.y, C.ink, 14, 300, 5); burst(o.x, o.y, C.red, 8, 260, 4); ents.splice(i, 1); n++; } }
    score += 25 * n * mult() + 50; if (n) popText("+" + 25 * n * mult(), player.x, player.y - 60 * u, 24 * u, C.red, 1.1);
  }

  // ---------- Input ----------
  function setTarget(x, y, touch) { player.tx = clamp(x, 22 * u, W - 22 * u); player.ty = clamp(touch ? y - 80 * u : y, 110 * u, H - 24 * u); }
  addEventListener("pointermove", (e) => { pointer.x = e.clientX; pointer.y = e.clientY; pointer.touch = e.pointerType !== "mouse"; if (state === "play") setTarget(e.clientX, e.clientY, pointer.touch); }, { passive: true });
  addEventListener("pointerdown", (e) => { pointer.x = e.clientX; pointer.y = e.clientY; pointer.touch = e.pointerType !== "mouse"; if (state === "play") setTarget(e.clientX, e.clientY, pointer.touch); });
  addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase();
    if (["arrowup", "arrowdown", "arrowleft", "arrowright", "w", "a", "s", "d"].includes(k)) { keys.add(k); e.preventDefault(); }
    if ((k === "enter" || k === " ") && (state === "title" || (state === "over" && overShown))) { e.preventDefault(); startGame(); }
  });
  addEventListener("keyup", (e) => keys.delete(e.key.toLowerCase()));
  addEventListener("blur", () => keys.clear());
  $("play").addEventListener("click", startGame);
  $("again").addEventListener("click", startGame);
  addEventListener("contextmenu", (e) => e.preventDefault());

  // ---------- Update ----------
  function update(dt) {
    time += dt; shake = Math.max(0, shake - dt * 1.6); flash = Math.max(0, flash - dt * 1.5); hitPulse = Math.max(0, hitPulse - dt * 2.2);
    for (const s of specks) { s.y -= s.v * dt * u; s.r += dt * 0.4; if (s.y < -10) { s.y = H + 10; s.x = rnd(0, W); } }

    const p = player;
    if (state === "title") {
      // lazy figure-eight behind the title card
      const a = time * 0.8, nx = W / 2 + Math.sin(a) * W * 0.36, ny = H * 0.5 + Math.sin(a * 2) * H * 0.3;
      const vx = Math.cos(a) * W * 0.36 * 0.8, vy = Math.cos(a * 2) * H * 0.3 * 1.6;
      p.x = nx; p.y = ny; p.rot = Math.atan2(vx, -vy); p.flap = time * 11;
    }
    else if (p.dead) { p.vy += 1500 * u * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += dt * 8; p.flap += dt * 4; }
    else {
      const sp = 620 * u * dt;
      if (keys.size) {
        if (keys.has("arrowleft") || keys.has("a")) p.tx -= sp; if (keys.has("arrowright") || keys.has("d")) p.tx += sp;
        if (keys.has("arrowup") || keys.has("w")) p.ty -= sp; if (keys.has("arrowdown") || keys.has("s")) p.ty += sp;
        p.tx = clamp(p.tx, 22 * u, W - 22 * u); p.ty = clamp(p.ty, 110 * u, H - 24 * u);
      }
      const k = 1 - Math.exp(-13 * dt), dx = p.tx - p.x, dy = p.ty - p.y;
      p.x += dx * k; p.y += dy * k;
      p.rot += (clamp(dx * 0.012, -0.5, 0.5) - p.rot) * (1 - Math.exp(-10 * dt));
      p.flap += dt * (13 + Math.min(Math.hypot(dx, dy) * 0.08, 8)); p.inv = Math.max(0, p.inv - dt);
      trail.push({ x: p.x, y: p.y + 20 * u }); if (trail.length > 20) trail.shift();
    }
    if (state === "over" && p.y > H + 120 * u) p.y = H + 120 * u;

    if (state === "play") {
      playT += dt; spawnT -= dt; starT -= dt;
      if (spawnT <= 0) { spawnTick(); spawnT = Math.max(0.34, 0.82 - playT * 0.005 - loops * 0.035) * rnd(0.8, 1.2); }
      if (starT <= 0) { spawnStar(); starT = 26; }
    }

    for (let i = ents.length - 1; i >= 0; i--) {
      const e = ents[i]; e.age += dt;
      if (e.type === "letter") { e.y += e.vy * dt; e.x = e.x0 + Math.sin(e.age * 2 + e.ph) * 20 * u; e.rot += e.vr * dt; e.rot = clamp(e.rot, -0.5, 0.5); if (e.vr && Math.abs(e.rot) >= 0.5) e.vr = -e.vr; }
      else if (e.type === "dagger") { e.x += e.vx * dt; e.y += e.vy * dt; }
      else if (e.type === "skull") { e.x += e.vx * dt; e.y = e.y0 + Math.sin(e.age * 3) * 34 * u + e.age * 22 * u; e.rot = Math.sin(e.age * 4) * 0.3; }
      else if (e.type === "star") { e.y += e.vy * dt; e.x = e.x0 + Math.sin(e.age * 2.4) * 30 * u; }
      if (e.y > H + 110 * u || e.x < -120 * u || e.x > W + 120 * u) { ents.splice(i, 1); continue; }
      if (state !== "play" || player.dead) continue;
      const px = player.x, py = player.y;
      if (e.type === "letter" || e.type === "star") {
        if (Math.hypot(e.x - px, e.y - py) < (e.type === "star" ? 40 : 34) * u) { ents.splice(i, 1); e.type === "star" ? collectStar(e) : collectLetter(e); }
      } else if (player.inv <= 0) {
        let hit = false;
        if (e.type === "dagger") { const ax = -Math.sin(e.rot), ay = Math.cos(e.rot); for (const o of [32, 14, -6]) if (Math.hypot(e.x + ax * o * u - px, e.y + ay * o * u - py) < 18 * u) hit = true; }
        else hit = Math.hypot(e.x - px, e.y - py) < 30 * u;
        if (hit) { if (e.type === "skull") ents.splice(i, 1); takeHit(); }
      }
    }
    for (let i = parts.length - 1; i >= 0; i--) { const q = parts[i]; q.life -= dt; if (q.life <= 0) { parts.splice(i, 1); continue; } q.vy += 700 * u * dt; q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= 1 - dt * 1.2; }
    for (let i = texts.length - 1; i >= 0; i--) { const t = texts[i]; t.life -= dt; if (t.life <= 0) texts.splice(i, 1); }
  }

  // ---------- Draw ----------
  function inkText(str, x, y, size, align, fill = C.mustard, shadow = C.red) {
    ctx.font = `${size}px ${DISPLAY_FONT}`; ctx.textAlign = align; ctx.textBaseline = "alphabetic"; ctx.lineJoin = "round";
    ctx.lineWidth = size * 0.2; ctx.strokeStyle = C.ink; ctx.strokeText(str, x, y);
    if (shadow) { ctx.fillStyle = shadow; ctx.fillText(str, x + size * 0.06, y + size * 0.07); }
    ctx.fillStyle = fill; ctx.fillText(str, x, y);
  }
  function drawTerminal() {
    const size = Math.max(10, 12 * u), lh = size * 1.25, x = Math.max(26, 28 * u);
    ctx.font = `${size}px ${MONO_FONT}`; ctx.textAlign = "left"; ctx.textBaseline = "alphabetic"; ctx.fillStyle = "rgba(26,20,18,0.3)";
    const shown = outLines.slice(-Math.floor((H * 0.55) / lh)); let y = H - 30 * u - (shown.length) * lh;
    for (const l of shown) { ctx.fillText(l, x, y += lh); }
    if (Math.floor(time * 1.6) % 2 === 0) ctx.fillText("█", x, y + lh);
  }
  function drawHud() {
    const m = Math.max(24, 26 * u), fs = 34 * u;
    inkText("Score " + score, m, m + fs * 0.78, fs, "left", C.mustard, C.red);
    const mu = mult(); if (mu > 1) inkText("x" + mu + " combo", m, m + fs * 0.78 + 24 * u, 22 * u, "left", C.cream, C.red);
    // lives
    for (let i = 0; i < 3; i++) {
      const cx = W - m - 18 * u - i * 36 * u, cy = m + 14 * u, on = i < lives, s = (on ? 0.95 : 0.8) * u * (on && hitPulse && i === lives - 1 ? 1 + hitPulse * 0.2 : 1);
      ctx.save(); ctx.translate(cx, cy); ctx.scale(s, s); ctx.globalAlpha = on ? 1 : 0.35; paint(P.heart, on ? C.red : null, 3.2); ctx.restore();
    }
    // phrase ribbon
    const fs2 = clamp(Math.min(34 * u, W / 17), 20, 40), gap = fs2 * 0.03;
    ctx.font = `${fs2}px ${DISPLAY_FONT}`;
    const ws = PHRASE.map((ch) => (ch === " " ? fs2 * 0.3 : ctx.measureText(ch).width) + gap), total = ws.reduce((a, b) => a + b, 0);
    const rw = total + fs2 * 1.6, rh = fs2 * 1.5, rx = W / 2 - rw / 2, ry = m + fs * 1.15 + 14 * u;
    const rib = new Path2D(); rib.moveTo(rx, ry); rib.lineTo(rx + rw, ry); rib.lineTo(rx + rw - rh * 0.28, ry + rh / 2); rib.lineTo(rx + rw, ry + rh); rib.lineTo(rx, ry + rh); rib.lineTo(rx + rh * 0.28, ry + rh / 2); rib.closePath();
    paint(rib, C.red, 3);
    let cx = rx + fs2 * 0.8; const base = ry + rh * 0.5 + fs2 * 0.3;
    const [ns, ne] = prog < TOKENS.length ? RANGES[prog] : [-1, -1];
    PHRASE.forEach((ch, i) => {
      const w = ws[i];
      if (ch !== " ") {
        const done = prog >= TOKENS.length ? true : RANGES.slice(0, prog).some((r) => i >= r[0] && i < r[1]);
        const cur = i >= ns && i < ne;
        ctx.font = `${fs2}px ${DISPLAY_FONT}`; ctx.textAlign = "left"; ctx.textBaseline = "alphabetic"; ctx.lineJoin = "round";
        if (done) { ctx.lineWidth = fs2 * 0.14; ctx.strokeStyle = C.ink; ctx.strokeText(ch, cx, base); ctx.fillStyle = C.mustard; ctx.fillText(ch, cx, base); }
        else if (cur) { const k = 0.5 + 0.5 * Math.sin(time * 9); ctx.save(); ctx.translate(cx + w / 2, base); ctx.scale(1 + k * 0.12, 1 + k * 0.12); ctx.lineWidth = fs2 * 0.14; ctx.strokeStyle = C.ink; ctx.strokeText(ch, -w / 2, 0); ctx.fillStyle = C.cream; ctx.fillText(ch, -w / 2, 0); ctx.restore(); }
        else { ctx.fillStyle = "rgba(251,243,222,0.42)"; ctx.fillText(ch, cx, base); }
      }
      cx += w;
    });
  }
  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.drawImage(bg, 0, 0, W, H);
    ctx.save();
    if (shake > 0 && !reduceMotion) ctx.translate(rnd(-1, 1) * shake * 14 * u, rnd(-1, 1) * shake * 14 * u);
    // drifting ink flecks
    ctx.strokeStyle = "rgba(26,20,18,0.13)"; ctx.lineWidth = 1.5;
    for (const s of specks) { const z = s.s * u; ctx.beginPath(); ctx.moveTo(s.x - z, s.y); ctx.lineTo(s.x + z, s.y); ctx.moveTo(s.x, s.y - z); ctx.lineTo(s.x, s.y + z); ctx.stroke(); }
    drawTerminal();
    // trail
    for (let i = 0; i < trail.length; i++) { const k = i / trail.length; ctx.globalAlpha = k * 0.5; ctx.fillStyle = i % 2 ? C.red : C.ink; ctx.beginPath(); ctx.arc(trail[i].x + Math.sin(i) * 3 * u, trail[i].y, k * 6 * u, 0, 7); ctx.fill(); }
    ctx.globalAlpha = 1;
    const needed = state === "play" ? neededCh() : null;
    for (const e of ents) {
      if (e.type === "dagger") { if (e.y < 0) drawWarn(e.x); drawDagger(e); }
      else if (e.type === "skull") { if (e.x < 0 || e.x > W) drawWarn(clamp(e.x, 0, W), true, e.y); drawSkull(e); }
      else if (e.type === "star") drawStar(e);
      else drawLetter(e, e.ch === needed);
    }
    if (!(state === "play" && player.inv > 0 && Math.floor(time * 16) % 2)) drawSwallow(player.x, player.y, player.rot, player.flap);
    for (const q of parts) { ctx.globalAlpha = clamp(q.life / q.max * 1.4, 0, 1); ctx.fillStyle = q.c; ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, 7); ctx.fill(); }
    ctx.globalAlpha = 1;
    for (const t of texts) { const k = 1 - t.life / t.max; ctx.globalAlpha = clamp(t.life / t.max * 2.2, 0, 1); inkText(t.text, t.x, t.y - k * t.rise * u, t.size, "center", t.color, t.color === C.red ? C.cream : C.red); }
    ctx.globalAlpha = 1;
    ctx.restore();
    if (flash > 0) { ctx.fillStyle = `rgba(234,179,58,${flash * 0.45})`; ctx.fillRect(0, 0, W, H); }
    if (state !== "title") drawHud();
  }
  function drawWarn(x, side, y) {
    const pulse = 0.6 + 0.4 * Math.sin(time * 24), sz = 15 * u;
    ctx.save(); ctx.globalAlpha = pulse; ctx.translate(side ? (x <= 0 ? 26 * u : W - 26 * u) : clamp(x, 26 * u, W - 26 * u), side ? y : 26 * u);
    const tri = new Path2D(); tri.moveTo(0, -sz); tri.lineTo(sz * 1.05, sz * 0.8); tri.lineTo(-sz * 1.05, sz * 0.8); tri.closePath(); paint(tri, C.red, 3);
    ctx.fillStyle = C.cream; ctx.font = `700 ${sz * 1.1}px ${MONO_FONT}`; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("!", 0, sz * 0.18); ctx.restore();
  }

  // ---------- Boot ----------
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
    cv.width = Math.ceil(W * dpr); cv.height = Math.ceil(H * dpr);
    u = clamp(Math.min(W / 520, H / 760), 0.55, 1.3);
    makeBg(); seedSpecks();
    if (state === "title") resetPlayer(); else { player.tx = clamp(player.tx, 22 * u, W - 22 * u); player.ty = clamp(player.ty, 110 * u, H - 24 * u); }
  }
  addEventListener("resize", resize);
  resize();
  let last = 0;
  function frame(ts) { const dt = Math.min(0.05, (ts - last) / 1000 || 0); last = ts; update(dt); draw(); requestAnimationFrame(frame); }
  requestAnimationFrame(frame);
  $("play").focus({ preventScroll: true });
})();
</script>
</body>
</html>
